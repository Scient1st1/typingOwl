<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Owl Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="classroom-container">
        <div class="text-box-container">
          <!-- Hidden input for mobile native keyboard -->
          <input
            type="text"
            id="mobile-input"
            class="mobile-input"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <div id="text-display" class="text-display">
            <!-- Text  here  -->
          </div>
        </div>

        <!-- Controls -->
        <div class="controls-container">
          <button id="restart-btn" class="control-btn">Restart</button>
          <button id="random-btn" class="control-btn">Random Text</button>
          <button id="lang-btn" class="control-btn">Lang:</button>
          <button id="pdf-btn" class="control-btn hidden">
            View Certificate
          </button>
        </div>

        <!-- Character and Messages Overlay (Hidden by default) -->
        <div id="owl-overlay" class="owl-overlay hidden">
          <div class="speech-bubble-container">
            <div id="speech-bubble" class="speech-bubble"></div>
          </div>
          <img id="owl-image" class="owl-image" src="" alt="Owl Teacher" />
        </div>

        <!-- Confetti Canvas (Hidden by default) -->
        <canvas id="confetti-canvas" class="confetti-canvas hidden"></canvas>

        <!-- Virtual Keyboard -->
        <div class="keyboard-container">
          <div id="keyboard" class="keyboard">
            <!-- Rows of keys injected by JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- Hidden Certificate for PDF -->
    <div id="certificate" class="certificate-container">
      <div class="cert-border-inner">
        <button id="close-cert-btn" class="close-btn">❌</button>
        <h1 class="cert-title">🌟 Typing Owl Certificate 🌟</h1>
        <p class="cert-subtitle">
          This certifies that you are an AMAZING typist! 🏆
        </p>
        <div class="cert-stats">
          <p id="cert-accuracy">🎯 Accuracy: 100%</p>
        </div>
        <div class="cert-footer">
          <p>Keep up the great work, superstar! 🦉✨</p>
          <!-- <button
            id="print-cert-btn"
            class="control-btn"
            style="margin-top: 20px; font-size: 20px"
          >
            🖨️ Print Certificate
          </button> -->
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </body>
</html>
